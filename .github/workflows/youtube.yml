name: Update YouTube videos
on:
  schedule:
    - cron: "17 5 * * 1" # every Monday morning
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/update-youtube.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }} # optional, ranks all uploads by views
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html partners.html youtube.json assets/eek-on-road.jpg
          git diff --cached --quiet || (git commit -m "Weekly YouTube update" && git push)
